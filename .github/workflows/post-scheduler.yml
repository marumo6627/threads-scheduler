name: Post Scheduler
on:
  schedule:
    # UTC=JST05:00〜23:55。バックアップ用(主起動はcron-job.org)。
    # 2026-09-14: 22,23,0-14 だと JST05:00〜07:00 が無防備で、05:30/05:37 の枠に
    # 代替の起動がなかった。実際 09-13 朝にこの時間帯でハングして114分遅れた。
    - cron: '*/5 20,21,22,23,0-14 * * *'
  workflow_dispatch: {}
# ★cancel-in-progress: true（2026-09-13）。false だと GitHub のランナー待ちで先頭が
# queued のまま詰まった時に後続が全部 cancelled になり、復旧まで止まる（今回2時間）。
# true にすると新しい run が古いものを打ち切って進むので、15分後に自動復旧する。
# 重複防止は post-scheduler=本文先頭24文字 / auto-reply=返信直前のAPI確認で担保済み。
concurrency: { group: post-scheduler, cancel-in-progress: true }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - env:
          THREADS_TOKENS: ${{ secrets.THREADS_TOKENS }}
          POSTS_JSON: ${{ secrets.POSTS_JSON }}
        run: node scripts/post-scheduler.mjs
      # ★翌日分が入っていなければ失敗させて通知する(2026-09-11/12 の生成漏れ対策)。
      # JST 20時台/22時台/23時台の最初の実行だけ判定するので、通知は1日最大3回。
      # 投稿ステップの後に置く。ここが落ちても当日の投稿には影響しない。
      - name: 翌日分の在庫確認
        env:
          POSTS_JSON: ${{ secrets.POSTS_JSON }}
        run: node scripts/check-tomorrow.mjs
