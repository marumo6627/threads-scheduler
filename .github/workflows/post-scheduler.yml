name: Post Scheduler
on:
  schedule:
    - cron: '*/5 22,23,0-14 * * *'   # UTC=JST07:00〜23:55。バックアップ用(主起動はcron-job.org)
  workflow_dispatch: {}
concurrency: { group: post-scheduler, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - env:
          THREADS_TOKENS: ${{ secrets.THREADS_TOKENS }}
          POSTS_JSON: ${{ secrets.POSTS_JSON }}
        run: node scripts/post-scheduler.mjs
      # ★翌日分が入っていなければ失敗させて通知する(2026-09-11/12 の生成漏れ対策)。
      # JST 20時台/22時台/23時台の最初の実行だけ判定するので、通知は1日最大3回。
      # 投稿ステップの後に置く。ここが落ちても当日の投稿には影響しない。
      - name: 翌日分の在庫確認
        env:
          POSTS_JSON: ${{ secrets.POSTS_JSON }}
        run: node scripts/check-tomorrow.mjs
