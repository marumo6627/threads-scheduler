name: Auto Reply
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
# ★cancel-in-progress: true（2026-09-13）。false だと GitHub のランナー待ちで先頭が
# queued のまま詰まった時に後続が全部 cancelled になり、復旧まで止まる（今回2時間）。
# true にすると新しい run が古いものを打ち切って進むので、15分後に自動復旧する。
# 重複防止は post-scheduler=本文先頭24文字 / auto-reply=返信直前のAPI確認で担保済み。
concurrency: { group: auto-reply, cancel-in-progress: true }
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - env:
          THREADS_TOKENS: ${{ secrets.THREADS_TOKENS }}
          REPLY_PARTS: ${{ secrets.REPLY_PARTS }}
          # 2026-10-19: 取りこぼし回収のため 40→96h。レート(--cap/DELAY_MS)は据え置き
          POST_WINDOW_H: '96'
        run: node scripts/auto-reply.mjs --cap 16
