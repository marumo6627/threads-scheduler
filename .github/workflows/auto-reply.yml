name: Auto Reply
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
concurrency: { group: auto-reply, cancel-in-progress: false }
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - env:
          THREADS_TOKENS: ${{ secrets.THREADS_TOKENS }}
          REPLY_PARTS: ${{ secrets.REPLY_PARTS }}
        run: node scripts/auto-reply.mjs
